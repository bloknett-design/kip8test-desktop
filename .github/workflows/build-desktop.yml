name: Build Desktop App

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'data/**'
      - 'images/**'
      - '.github/workflows/build-desktop.yml'
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ─── Linux ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (AppImage + deb)
        run: npx electron-builder --linux --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: KIPiA-linux-AppImage
          path: dist/*.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: KIPiA-linux-deb
          path: dist/*.deb

  # ─── Windows ────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (NSIS, x64 + ia32/Win32) + publish update metadata
        run: npx electron-builder --win --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installers (x64 + Win32)
        uses: actions/upload-artifact@v4
        with:
          name: KIPiA-win-setup
          path: dist/*.exe

      - name: Upload update metadata (latest.yml)
        uses: actions/upload-artifact@v4
        with:
          name: KIPiA-win-update-metadata
          path: dist/latest*.yml

  # ─── macOS ──────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (dmg) + publish update metadata
        run: npx electron-builder --mac --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: KIPiA-mac-dmg
          path: dist/*.dmg

  # ─── Release (создаётся при пуше тега v*) ──────────────
  release:
    needs: [ build-linux, build-win, build-mac ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'КИПиА ${{ github.ref_name }}'
          body: |
            ## Десктопное приложение КИПиА (Test) ${{ github.ref_name }}

            ### Установка
            - **Windows 64-бит** — скачайте `KIPiA-Test-Setup-*-x64.exe`, запустите установщик (на русском языке)
            - **Windows 32-бит (Win32)** — скачайте `KIPiA-Test-Setup-*-ia32.exe` — отдельная сборка для 32-битных систем
            - **Linux** — скачайте `KIPiA-Test-*.AppImage` (портативный, без установки) или `KIPiA-Test-*.deb` (`sudo dpkg -i`)
            - **macOS** — скачайте `KIPiA-Test-*.dmg`, перетащите в Applications

            ### Автообновление
            Приложение автоматически проверяет обновления при запуске. Каждая сборка (64-бит и 32-бит) обновляется независимо — приложение само выбирает подходящий файл.
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.dmg
            release-artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
